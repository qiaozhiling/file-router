<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>视频播放</title>
    <script th:src="@{/mobile-player-controls.js}"></script>
    <script th:src="@{/video-player.js}"></script>
    <link rel="stylesheet" th:href="@{/mobile-player.css}">
</head>
<body>
<div id="video-player" aria-label="视频播放器"></div>
<div id="playback-status" role="status" aria-live="polite">正在加载播放器…</div>
<script th:inline="javascript">
    const filePath = [[${filePath}]];
    const mediaBase = [[${mediaBase}]];
    const assetBase = /*[[@{/libmedia/}]]*/ '/libmedia/';
    const subtitlesApi = /*[[@{/api/subtitles}]]*/ '/api/subtitles';
    // Encode each segment exactly once, including literal percent signs and fragments.
    const videoUrl = mediaBase + filePath.split('/').map(encodeURIComponent).join('/');
    FileRouterVideoPlayer.load(document.getElementById('video-player'), {
        url: videoUrl, assets: assetBase, subtitlesApi, filePath,
        status: document.getElementById('playback-status')
    }).catch(error => {
        document.getElementById('playback-status').textContent = error.message;
        console.error(error);
    });
</script>
</body>
</html>
