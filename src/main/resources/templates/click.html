<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ClickBoard</title>
    <script defer th:src="@{/clipboard.js}"></script>
</head>
<body>
<div>
    <input id="textup" name="cont">
    <button id="submit" type="button" th:data-submit-url="@{/uptext}">submit</button>
    <!--    <button id="paste">paste</button>-->
</div>

<div th:if="${type}=='text'" style="margin-top: 1em">
    <input id="textdown" th:value="${content}">
    <button id="copy" type="button">copy</button>
</div>
<div style="margin-top: 1em">
    <img th:if="${type}=='image'" th:src="${content}" alt="" style="max-width:100%; overflow:hidden; ">
</div>

<style>
    button {
        position: relative;
        display: inline-block;
        cursor: pointer;
        background: #0075ff;
        padding: 10px 15px;
        color: #ffffff;
        text-align: center;
        border-radius: 3px;
        overflow: hidden
    }
</style>
</body>
</html>
